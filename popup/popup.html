<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusAI</title>
  <link class="style-link" rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- MAIN VIEW -->
    <div id="main-view">
      <header class="header">
        <div class="logo-row" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <img src="../icons/icon128.png" alt="FocusAI Logo" class="logo-img">
            <div class="logo-text-col">
              <h1 class="logo">FocusAI</h1>
              <span class="badge">Focus Mode</span>
            </div>
          </div>
          <div id="usage-nav-link" class="usage-link" style="cursor: pointer; font-size: 12px; color: #A1A1AA; font-weight: 500; display: flex; align-items: center; gap: 4px;">
            <span>◷ Usage</span>
          </div>
        </div>
        <p class="tagline">Focus on what matters.<br>Know how you spend your time.</p>
      </header>

      <hr class="divider">

      <main class="main-content">
        <!-- ChatGPT Platform Detection Card -->
        <div class="status-card">
          <span class="status-label">ChatGPT</span>
          <div id="status-indicator" class="status-value not-detected">
            <span class="status-dot">○</span> Not detected
          </div>
        </div>

        <!-- Spacer -->
        <div class="spacer"></div>

        <!-- Focus State Persistent Control Card -->
        <div class="status-card">
          <div class="focus-control-header">
            <span class="status-label">Focus State</span>
            <label class="switch" id="focus-switch-wrapper">
              <input type="checkbox" id="focus-toggle">
              <span class="slider round"></span>
            </label>
          </div>
          <div id="focus-state-text" class="status-value inactive">
            Inactive
          </div>
        </div>

        <!-- Open ChatGPT Action (hidden by default) -->
        <div id="open-chatgpt-container" class="action-card" style="display: none;">
          <button id="open-chatgpt-btn" class="action-btn">Open ChatGPT</button>
        </div>
      </main>
    </div>

    <!-- USAGE VIEW -->
    <div id="usage-view" style="display: none;">
      <div class="usage-header" style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px; cursor: pointer;">
        <span class="back-btn" id="usage-back-btn" style="font-size: 13px; color: #A1A1AA; font-weight: 600; display: flex; align-items: center; gap: 4px;">← FocusAI</span>
      </div>

      <div class="status-card" style="margin-bottom: 12px;">
        <span class="status-label">TODAY</span>
        <div id="usage-status-badge" class="status-value active" style="font-size: 11px; margin-top: 4px;">PAUSED</div>
      </div>

      <!-- Metrics grid -->
      <div class="metrics-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;">
        <div class="status-card" style="display: flex; flex-direction: column; gap: 4px;">
          <span class="status-label" style="font-size: 10px;">Started</span>
          <span id="usage-started-text" class="status-value" style="font-size: 15px; font-weight: 700; color: #FAFAFA;">--:--</span>
        </div>
        <div class="status-card" style="display: flex; flex-direction: column; gap: 4px;">
          <span class="status-label" style="font-size: 10px;">Used</span>
          <span id="usage-used-text" class="status-value" style="font-size: 15px; font-weight: 700; color: #FAFAFA;">0m</span>
        </div>
      </div>

      <div class="status-card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span class="status-label">Sessions</span>
        <span id="usage-sessions-text" class="status-value" style="font-weight: 700; color: #FAFAFA;">0</span>
      </div>

      <div class="status-card" style="display: flex; justify-content: space-between; align-items: center;">
        <span class="status-label">Next reset</span>
        <span id="usage-reset-text" class="status-value" style="color: #A1A1AA;">--:--</span>
      </div>
    </div>

    <hr class="divider">

    <footer class="footer">
      <p class="footer-title">Phase -4</p>
      <p class="footer-subtitle">Usage Tracking Engine + Usage View</p>
    </footer>
  </div>
  <!-- Loading messaging and core contracts for popup logic access -->
  <script src="../core/messaging/messages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
