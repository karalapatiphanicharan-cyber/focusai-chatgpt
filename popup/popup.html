<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusAI</title>
  <link class="style-link" rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- MAIN POPUP VIEW -->
    <div id="main-view">
      <header class="header">
        <div class="header-row" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          <div class="logo-row" style="display: flex; align-items: center; gap: 8px;">
            <img src="../icons/icon128.png" alt="FocusAI Logo" class="logo-img" style="width: 24px; height: 24px; border-radius: 6px;">
            <div class="logo-text-col" style="display: flex; flex-direction: column; line-height: 1;">
              <h1 class="logo" style="font-size: 15px; font-weight: 700; color: #FAFAFA; margin: 0; letter-spacing: -0.01em;">FocusAI</h1>
              <span class="badge" style="font-size: 8px; font-weight: 600; color: #6366F1; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 1px;">Focus Mode</span>
            </div>
          </div>
          <!-- Usage Navigation moved to Top-Right -->
          <button id="usage-nav-link" class="usage-nav-btn" aria-label="Open Usage View" style="background: none; border: none; color: #6366F1; font-size: 11px; font-weight: 600; cursor: pointer; padding: 4px 6px; font-family: inherit; transition: color 0.15s ease;">Usage →</button>
        </div>
        <p class="tagline" style="font-size: 11px; color: #A1A1AA; margin: 10px 0 0 0; line-height: 1.4;">Focus on what matters.<br>Know how you spend your time.</p>
      </header>

      <hr class="divider" style="border: 0; height: 1px; background-color: #18181B; margin: 12px 0;">

      <main class="main-content" style="display: flex; flex-direction: column; gap: 12px;">

        <!-- STATE A: NOT ON CHATGPT -->
        <div id="state-non-chatgpt" style="display: none;">
          <!-- Status card showing Not detected -->
          <div class="status-card" style="background-color: #18181B; border: 1px solid #27272A; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);">
            <span class="status-label" style="font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #A1A1AA;">ChatGPT</span>
            <div id="status-indicator-a" class="status-value not-detected" style="font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; color: #A1A1AA;">
              <span class="status-dot" style="font-size: 12px; line-height: 1;">○</span> Not detected
            </div>
          </div>
          <p class="explanation-text" style="font-size: 11px; color: #A1A1AA; text-align: center; margin: 12px 0;">Open ChatGPT to activate FocusAI.</p>
          <div id="open-chatgpt-container" class="action-card" style="display: flex; justify-content: center; align-items: center;">
            <button id="open-chatgpt-btn" class="action-btn" style="background-color: #6366F1; color: #FAFAFA; border: none; border-radius: 6px; padding: 8px 16px; font-size: 11px; font-weight: 600; cursor: pointer; width: 100%; text-align: center; font-family: inherit; transition: background-color 0.15s ease, transform 0.1s ease; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);">Open ChatGPT</button>
          </div>
        </div>

        <!-- STATE B: CHATGPT DETECTED -->
        <div id="state-chatgpt" style="display: none;">
          <!-- Status card showing Detected -->
          <div class="status-card" style="background-color: #18181B; border: 1px solid #27272A; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); margin-bottom: 12px;">
            <span class="status-label" style="font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #A1A1AA;">ChatGPT</span>
            <div id="status-indicator-b" class="status-value detected" style="font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; color: #22D3EE;">
              <span class="status-dot" style="font-size: 12px; line-height: 1;">●</span> Detected
            </div>
          </div>

          <!-- Focus State Card -->
          <div class="status-card" style="background-color: #18181B; border: 1px solid #27272A; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);">
            <div class="focus-control-header" style="display: flex; justify-content: space-between; align-items: center;">
              <span class="status-label" style="font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #A1A1AA;">Focus State</span>
              <label class="switch" id="focus-switch-wrapper" style="position: relative; display: inline-block; width: 34px; height: 20px;">
                <input type="checkbox" id="focus-toggle">
                <span class="slider round"></span>
              </label>
            </div>
            <div id="focus-state-text" class="status-value inactive" style="font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; color: #A1A1AA;">
              Inactive
            </div>
          </div>

          <!-- Keyboard Shortcut Hint -->
          <div class="shortcut-hint" style="display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; margin-top: 14px;">
            <span style="font-size: 10px; font-weight: 500; color: #E4E4E7; display: flex; align-items: center; gap: 4px;">⌨ Ctrl + Shift + F</span>
            <span style="font-size: 8px; color: #71717A; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">Toggle Focus Mode</span>
          </div>
        </div>

      </main>
    </div>

    <!-- SEPARATE USAGE VIEW -->
    <div id="usage-view" style="display: none;">
      <div class="usage-header" id="usage-back-btn" style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; cursor: pointer;">
        <span class="back-btn" style="font-size: 13px; color: #A1A1AA; font-weight: 600; display: flex; align-items: center; gap: 4px;">← FocusAI</span>
      </div>

      <header class="header" style="gap: 4px; margin-bottom: 12px;">
        <h2 class="logo" style="font-size: 16px;">Usage</h2>
        <p class="tagline" style="font-size: 10px;">Your ChatGPT start times</p>
      </header>

      <div class="week-range-card" style="background-color: #18181B; border: 1px solid #27272A; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; text-align: center;">
        <span id="usage-week-range" style="font-size: 11px; font-weight: 600; color: #FAFAFA; letter-spacing: 0.02em;">-- — --</span>
      </div>

      <!-- Weekly Sunday-Saturday List -->
      <div class="weekly-list" id="weekly-list-container" style="display: flex; flex-direction: column; gap: 6px;">
        <!-- Rows will be injected dynamically -->
      </div>
    </div>

  </div>

  <script src="../core/messaging/messages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
