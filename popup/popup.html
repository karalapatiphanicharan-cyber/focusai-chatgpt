<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusAI</title>
  <link class="style-link" rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">

    <!-- MAIN POPUP VIEW -->
    <div id="main-view">
      <header class="header">
        <div class="logo-row">
          <img src="../icons/icon128.png" alt="FocusAI Logo" class="logo-img">
          <div class="logo-text-col">
            <h1 class="logo">FocusAI</h1>
            <span class="badge">Focus Mode</span>
          </div>
        </div>
        <p class="tagline">Focus on what matters.<br>Know how you spend your time.</p>
      </header>

      <hr class="divider">

      <main class="main-content">
        <!-- ChatGPT Platform Detection Card -->
        <div class="status-card">
          <span class="status-label">ChatGPT</span>
          <div id="status-indicator" class="status-value not-detected">
            <span class="status-dot">○</span> Not detected
          </div>
        </div>

        <!-- Spacer -->
        <div class="spacer"></div>

        <!-- Focus State Persistent Control Card -->
        <div class="status-card">
          <div class="focus-control-header">
            <span class="status-label">Focus State</span>
            <label class="switch" id="focus-switch-wrapper">
              <input type="checkbox" id="focus-toggle">
              <span class="slider round"></span>
            </label>
          </div>
          <div id="focus-state-text" class="status-value inactive">
            Inactive
          </div>
        </div>

        <!-- Open ChatGPT Action (hidden by default) -->
        <div id="open-chatgpt-container" class="action-card" style="display: none;">
          <button id="open-chatgpt-btn" class="action-btn">Open ChatGPT</button>
        </div>

        <hr class="divider" style="margin: 6px 0;">

        <!-- Compact Usage Navigation Item -->
        <div id="usage-nav-link" class="usage-link" style="cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 4px 6px;">
          <span class="status-label" style="font-size: 11px; text-transform: none; font-weight: 500; color: #A1A1AA; letter-spacing: normal;">Usage</span>
          <span style="font-size: 11px; color: #6366F1; font-weight: 600;">Weekly ChatGPT starts →</span>
        </div>
      </main>
    </div>

    <!-- SEPARATE USAGE VIEW -->
    <div id="usage-view" style="display: none;">
      <div class="usage-header" id="usage-back-btn" style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px; cursor: pointer;">
        <span class="back-btn" style="font-size: 13px; color: #A1A1AA; font-weight: 600; display: flex; align-items: center; gap: 4px;">← FocusAI</span>
      </div>

      <header class="header" style="gap: 4px; margin-bottom: 12px;">
        <h2 class="logo" style="font-size: 16px;">Usage</h2>
        <p class="tagline" style="font-size: 10px;">Your ChatGPT start times</p>
      </header>

      <div class="week-range-card" style="background-color: #18181B; border: 1px solid #27272A; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; text-align: center;">
        <span id="usage-week-range" style="font-size: 11px; font-weight: 600; color: #FAFAFA; letter-spacing: 0.02em;">Aug 9 — Aug 15</span>
      </div>

      <!-- Weekly Sunday-Saturday List -->
      <div class="weekly-list" id="weekly-list-container" style="display: flex; flex-direction: column; gap: 6px;">
        <!-- Rows will be injected dynamically -->
      </div>
    </div>

    <hr class="divider">

    <footer class="footer">
      <p class="footer-title">Phase 4.1</p>
      <p class="footer-subtitle">Usage View + Weekly ChatGPT starts</p>
    </footer>
  </div>

  <script src="../core/messaging/messages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
