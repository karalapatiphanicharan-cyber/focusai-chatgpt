<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusAI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-row">
        <img src="../icons/icon128.png" alt="FocusAI Logo" class="logo-img">
        <div class="logo-text-col">
          <h1 class="logo">FocusAI</h1>
          <span class="badge">Focus Mode</span>
        </div>
      </div>
      <p class="tagline">Focus on what matters.<br>Know how you spend your time.</p>
    </header>

    <hr class="divider">

    <main class="main-content">
      <!-- ChatGPT Platform Detection Card -->
      <div class="status-card">
        <span class="status-label">ChatGPT</span>
        <div id="status-indicator" class="status-value not-detected">
          <span class="status-dot">○</span> Not detected
        </div>
      </div>

      <!-- Spacer -->
      <div class="spacer"></div>

      <!-- Focus State Persistent Control Card -->
      <div class="status-card">
        <div class="focus-control-header">
          <span class="status-label">Focus State</span>
          <label class="switch">
            <input type="checkbox" id="focus-toggle">
            <span class="slider round"></span>
          </label>
        </div>
        <div id="focus-state-text" class="status-value inactive">
          Inactive
        </div>
      </div>
    </main>

    <hr class="divider">

    <footer class="footer">
      <p class="footer-title">Phase -1.1</p>
      <p class="footer-subtitle">State Management + Communication Layer</p>
    </footer>
  </div>
  <!-- Loading messaging and core contracts forpopup logic access -->
  <script src="../core/messaging/messages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
